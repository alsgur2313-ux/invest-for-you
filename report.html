<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리포트 — Invest For You</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;color:#1a2340;background:#f8faff;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(255,255,255,0.96);border-bottom:1px solid #e8ecf4;padding:0 5%;}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;}
.logo{font-size:18px;font-weight:700;color:#1a2340;cursor:pointer;}
.logo span{color:#2563eb;}
.nav-links{display:flex;gap:28px;align-items:center;}
.nav-links a{font-size:14px;color:#4b5675;cursor:pointer;transition:color .2s;}
.nav-links a:hover{color:#2563eb;}
.nav-links a.active{color:#2563eb;font-weight:500;}
.nav-cta{background:#2563eb;color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;}
.hamburger span{display:block;width:22px;height:2px;background:#1a2340;border-radius:2px;}
.mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;background:#fff;border-bottom:1px solid #e8ecf4;padding:12px 5%;z-index:199;flex-direction:column;}
.mobile-menu a{display:block;padding:13px 0;font-size:15px;color:#4b5675;border-bottom:1px solid #f1f5f9;cursor:pointer;}
.mobile-menu.open{display:flex;}
.report-hero{background:linear-gradient(160deg,#0f1f4b 0%,#1a3580 60%,#1e40af 100%);padding:110px 5% 60px;}
.report-hero-inner{max-width:1100px;margin:0 auto;}
.report-hero h1{font-size:36px;font-weight:700;color:#fff;margin-bottom:12px;letter-spacing:-0.5px;word-break:keep-all;}
.report-hero p{font-size:15px;color:rgba(255,255,255,0.65);font-weight:300;word-break:keep-all;margin-bottom:32px;}
.report-stats{display:flex;gap:24px;flex-wrap:wrap;}
.rstat{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:12px 20px;text-align:center;}
.rstat-num{font-size:20px;font-weight:700;color:#fff;}
.rstat-label{font-size:11px;color:rgba(255,255,255,0.55);margin-top:2px;}
.filter-bar{background:#fff;border-bottom:1px solid #e8ecf4;padding:0 5%;position:sticky;top:64px;z-index:100;}
.filter-inner{max-width:1100px;margin:0 auto;display:flex;gap:8px;padding:14px 0;overflow-x:auto;scrollbar-width:none;}
.filter-inner::-webkit-scrollbar{display:none;}
.ftag{padding:7px 16px;border-radius:20px;border:1px solid #e2e8f4;font-size:13px;cursor:pointer;color:#64748b;background:#fff;font-family:'Noto Sans KR',sans-serif;transition:all .2s;white-space:nowrap;}
.ftag.active{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:500;}
.ftag:hover:not(.active){background:#f1f5f9;}
.search-bar{max-width:1100px;margin:28px auto 0;padding:0 5%;}
.search-input-wrap{position:relative;}
.search-input-wrap input{width:100%;padding:12px 18px 12px 44px;border:1px solid #e2e8f4;border-radius:10px;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;background:#fff;color:#1a2340;}
.search-input-wrap input:focus{border-color:#2563eb;}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:16px;}
.main{max-width:1100px;margin:0 auto;padding:32px 5% 80px;}
.featured-card{background:#fff;border:1px solid #e2e8f4;border-radius:16px;padding:32px;margin-bottom:32px;cursor:pointer;transition:box-shadow .25s,transform .25s;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;}
.featured-card:hover{box-shadow:0 10px 36px rgba(37,99,235,0.09);transform:translateY(-2px);}
.featured-badge{display:inline-block;background:#2563eb;color:#fff;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;margin-bottom:12px;}
.featured-card h2{font-size:22px;font-weight:700;color:#1a2340;line-height:1.4;margin-bottom:10px;word-break:keep-all;}
.featured-card p{font-size:14px;color:#64748b;line-height:1.7;font-weight:300;word-break:keep-all;margin-bottom:16px;}
.featured-meta{display:flex;gap:16px;font-size:12px;color:#94a3b8;flex-wrap:wrap;align-items:center;}
.featured-thumb{width:120px;height:120px;background:#eff6ff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:48px;flex-shrink:0;}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.section-header h3{font-size:16px;font-weight:700;color:#1a2340;}
.report-count{font-size:13px;color:#94a3b8;}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.report-card{background:#fff;border:1px solid #e2e8f4;border-radius:14px;overflow:hidden;cursor:pointer;transition:box-shadow .25s,transform .25s;}
.report-card:hover{box-shadow:0 8px 28px rgba(37,99,235,0.09);transform:translateY(-3px);}
.report-card-top{padding:20px 20px 0;}
.report-tag{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:10px;}
.tag-market{background:#eff6ff;color:#2563eb;}
.tag-stock{background:#f0fdf4;color:#16a34a;}
.tag-tax{background:#fefce8;color:#ca8a04;}
.tag-global{background:#fdf4ff;color:#9333ea;}
.tag-etc{background:#f1f5f9;color:#475569;}
.report-card h3{font-size:14px;font-weight:700;color:#1a2340;line-height:1.5;margin-bottom:8px;word-break:keep-all;}
.report-card p{font-size:12px;color:#64748b;line-height:1.65;font-weight:300;word-break:keep-all;}
.report-card-bottom{padding:12px 20px 16px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #f1f5f9;margin-top:14px;}
.report-date{font-size:11px;color:#94a3b8;}
.report-read{font-size:11px;color:#94a3b8;}
.no-result{text-align:center;padding:60px 0;color:#94a3b8;font-size:15px;}
.loading{text-align:center;padding:60px 0;}
.loading-spinner{width:36px;height:36px;border:3px solid #e2e8f4;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,21,48,0.65);z-index:300;overflow-y:auto;padding:40px 5%;}
.overlay.open{display:flex;justify-content:center;align-items:flex-start;}
.article{background:#fff;border-radius:20px;max-width:820px;width:100%;padding:48px;position:relative;margin:auto;}
.article-progress{position:sticky;top:-48px;height:3px;background:#e2e8f4;margin:-48px -48px 36px;border-radius:20px 20px 0 0;overflow:hidden;}
.article-progress-bar{height:100%;background:#2563eb;width:0%;}
.article-close{position:absolute;top:18px;right:22px;background:#f1f5f9;border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;color:#64748b;display:flex;align-items:center;justify-content:center;}
.article-close:hover{background:#e2e8f4;}
.article-tag-label{font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px;display:inline-block;margin-bottom:16px;}
.article h1{font-size:26px;font-weight:700;color:#1a2340;line-height:1.4;margin-bottom:12px;word-break:keep-all;}
.article-meta{font-size:13px;color:#94a3b8;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid #f1f5f9;display:flex;gap:16px;flex-wrap:wrap;}
.article-body h2{font-size:19px;font-weight:700;color:#1a2340;margin:32px 0 14px;word-break:keep-all;}
.article-body h3{font-size:16px;font-weight:700;color:#1a2340;margin:24px 0 10px;word-break:keep-all;}
.article-body p{font-size:15px;color:#334155;line-height:1.9;margin-bottom:16px;font-weight:300;word-break:keep-all;}
.article-body ul,.article-body ol{margin:0 0 16px 20px;}
.article-body li{font-size:15px;color:#334155;line-height:1.9;font-weight:300;word-break:keep-all;margin-bottom:6px;}
.article-highlight{background:#eff6ff;border-left:4px solid #2563eb;border-radius:0 10px 10px 0;padding:16px 20px;margin:24px 0;}
.article-highlight p{font-size:14px;color:#1e40af;line-height:1.75;margin:0;font-weight:400;word-break:keep-all;}
.article-table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px;}
.article-table th{background:#f8faff;padding:10px 14px;text-align:left;font-weight:500;color:#1a2340;border:1px solid #e2e8f4;}
.article-table td{padding:10px 14px;color:#334155;border:1px solid #e2e8f4;line-height:1.6;word-break:keep-all;}
.article-table tr:nth-child(even) td{background:#fafbfe;}
.article-conclusion{background:#0f1f4b;border-radius:12px;padding:24px 28px;margin-top:32px;}
.article-conclusion p{font-size:14px;color:rgba(255,255,255,0.8);line-height:1.8;margin:0;word-break:keep-all;}
.article-disclaimer{margin-top:20px;padding:12px 16px;background:#f8faff;border-radius:8px;font-size:12px;color:#94a3b8;line-height:1.6;}
@media(max-width:768px){
  .nav-links,.nav-cta{display:none;}
  .hamburger{display:flex;}
  .report-hero{padding:90px 5% 40px;}
  .report-hero h1{font-size:24px;}
  .featured-card{grid-template-columns:1fr;}
  .featured-thumb{display:none;}
  .report-grid{grid-template-columns:1fr;gap:12px;}
  .article{padding:24px 18px;}
  .article h1{font-size:20px;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo" onclick="location.href='index.html'">Invest <span>For You</span></div>
    <div class="nav-links">
      <a href="index.html">홈</a>
      <a href="index.html#philosophy">투자 철학</a>
      <a href="index.html#scheme">금융 제도</a>
      <a href="index.html#blog">인사이트</a>
      <a href="report.html" class="active">리포트</a>
    </div>
    <button class="nav-cta" onclick="location.href='index.html#subscribe'">구독하기</button>
    <div class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  </div>
</nav>
<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">홈</a>
  <a href="index.html#philosophy">투자 철학</a>
  <a href="index.html#scheme">금융 제도</a>
  <a href="index.html#blog">인사이트</a>
  <a href="report.html">리포트</a>
  <a href="index.html#contact">문의하기</a>
</div>

<div class="report-hero">
  <div class="report-hero-inner">
    <h1>📋 투자 리포트</h1>
    <p>시장 분석, 종목 분석, 절세 전략을 매일 기록합니다.<br>모든 내용은 개인적인 의견이며 투자 권유가 아닙니다.</p>
    <div class="report-stats">
      <div class="rstat"><div class="rstat-num" id="totalCount">—</div><div class="rstat-label">전체 리포트</div></div>
      <div class="rstat"><div class="rstat-num" id="thisMonthCount">—</div><div class="rstat-label">이번 달</div></div>
      <div class="rstat"><div class="rstat-num" id="latestDate">—</div><div class="rstat-label">최근 업데이트</div></div>
    </div>
  </div>
</div>

<div class="search-bar">
  <div class="search-input-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="리포트 제목이나 키워드로 검색하세요..." oninput="filterReports()">
  </div>
</div>

<div class="filter-bar">
  <div class="filter-inner">
    <button class="ftag active" onclick="setFilter('전체',this)">전체</button>
    <button class="ftag" onclick="setFilter('시장분석',this)">📊 시장분석</button>
    <button class="ftag" onclick="setFilter('종목분석',this)">🔍 종목분석</button>
    <button class="ftag" onclick="setFilter('절세전략',this)">💰 절세전략</button>
    <button class="ftag" onclick="setFilter('글로벌',this)">🌏 글로벌</button>
    <button class="ftag" onclick="setFilter('기타',this)">📝 기타</button>
  </div>
</div>

<div class="main">
  <div id="featuredSection"></div>
  <div class="section-header">
    <h3>전체 리포트</h3>
    <span class="report-count" id="reportCount"></span>
  </div>
  <div id="reportGrid" class="report-grid">
    <div class="loading" style="grid-column:1/-1;">
      <div class="loading-spinner"></div>
      <div style="font-size:14px;color:#94a3b8;">리포트를 불러오는 중...</div>
    </div>
  </div>
  <div class="no-result" id="noResult" style="display:none;">검색 결과가 없습니다.</div>
</div>

<div class="overlay" id="overlay" onclick="closeArticle(event)">
  <div class="article" id="articleBox">
    <div class="article-progress"><div class="article-progress-bar" id="progressBar"></div></div>
    <button class="article-close" onclick="closeOverlay()">✕</button>
    <div id="articleContent"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAT3jg8UmywwkTP-YYmDr1fqlCXqgmCQHs",
  authDomain: "invest-for-you.firebaseapp.com",
  projectId: "invest-for-you",
  storageBucket: "invest-for-you.firebasestorage.app",
  messagingSenderId: "66231759400",
  appId: "1:66231759400:web:646d98ed15c839d26f7b1d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tagClass = { '시장분석':'tag-market','종목분석':'tag-stock','절세전략':'tag-tax','글로벌':'tag-global','기타':'tag-etc' };
let allReports = [];
let currentFilter = '전체';

async function loadReports() {
  const q = query(collection(db, 'reports'), orderBy('createdAt', 'desc'));
  const snap = await getDocs(q);
  allReports = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  const now = new Date();
  const thisMonth = allReports.filter(r => r.date?.startsWith(`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}`));
  document.getElementById('totalCount').textContent = allReports.length;
  document.getElementById('thisMonthCount').textContent = thisMonth.length;
  document.getElementById('latestDate').textContent = allReports[0]?.date?.slice(5) || '—';

  renderFeatured();
  filterReports();
}

function renderFeatured() {
  const f = allReports.find(r => r.featured);
  if (!f) { document.getElementById('featuredSection').innerHTML = ''; return; }
  document.getElementById('featuredSection').innerHTML = `
    <div class="featured-card" onclick="openReport('${f.id}')">
      <div>
        <span class="featured-badge">✨ 최신 리포트</span>
        <h2>${f.title}</h2>
        <p>${f.summary}</p>
        <div class="featured-meta">
          <span>📅 ${f.date}</span>
          <span>⏱ ${f.read} 읽기</span>
          <span class="report-tag ${tagClass[f.category]||'tag-etc'}">${f.category}</span>
        </div>
      </div>
      <div class="featured-thumb">${f.emoji||'📊'}</div>
    </div>`;
}

window.filterReports = () => {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allReports.filter(r => {
    const matchCat = currentFilter === '전체' || r.category === currentFilter;
    const matchSearch = r.title?.toLowerCase().includes(search) || r.summary?.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });
  renderGrid(filtered);
};

window.setFilter = (cat, btn) => {
  currentFilter = cat;
  document.querySelectorAll('.ftag').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterReports();
};

function renderGrid(list) {
  const grid = document.getElementById('reportGrid');
  const noResult = document.getElementById('noResult');
  document.getElementById('reportCount').textContent = `총 ${list.length}개`;
  if (list.length === 0) { grid.innerHTML = ''; noResult.style.display = 'block'; return; }
  noResult.style.display = 'none';
  grid.innerHTML = list.map(r => `
    <div class="report-card" onclick="openReport('${r.id}')">
      <div class="report-card-top">
        <span class="report-tag ${tagClass[r.category]||'tag-etc'}">${r.category}</span>
        <h3>${r.title}</h3>
        <p>${r.summary}</p>
      </div>
      <div class="report-card-bottom">
        <span class="report-date">📅 ${r.date}</span>
        <span class="report-read">⏱ ${r.read}</span>
      </div>
    </div>`).join('');
}

window.openReport = (id) => {
  const r = allReports.find(x => x.id === id);
  if (!r) return;
  document.getElementById('articleContent').innerHTML = `
    <span class="article-tag-label ${tagClass[r.category]||'tag-etc'}">${r.category}</span>
    <h1>${r.title}</h1>
    <div class="article-meta"><span>📅 ${r.date}</span><span>⏱ ${r.read} 읽기</span></div>
    <div class="article-body">${r.content}</div>
    <div class="article-disclaimer">⚠️ 본 리포트의 모든 내용은 개인적인 의견이며 투자 권유가 아닙니다. 투자 판단의 최종 책임은 투자자 본인에게 있습니다.</div>`;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('articleBox').scrollTop = 0;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('articleBox').onscroll = () => {
    const b = document.getElementById('articleBox');
    document.getElementById('progressBar').style.width = Math.min((b.scrollTop/(b.scrollHeight-b.clientHeight))*100,100)+'%';
  };
};

window.closeOverlay = () => { document.getElementById('overlay').classList.remove('open'); document.body.style.overflow = ''; };
window.closeArticle = (e) => { if(e.target===document.getElementById('overlay')) closeOverlay(); };
document.addEventListener('keydown', e => { if(e.key==='Escape') closeOverlay(); });
window.toggleMenu = () => document.getElementById('mobileMenu').classList.toggle('open');

loadReports();
</script>
</body>
</html>
